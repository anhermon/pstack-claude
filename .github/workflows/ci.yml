name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.0
      - name: Tool tests and typecheck
        working-directory: skills/poteto-mode/scripts
        run: |
          bun install --frozen-lockfile
          bun test orch watch-pr
          bun run typecheck
      - name: Frontmatter, hook, codemod
        run: |
          python3 -m pip install pyyaml
          python3 scripts/check-frontmatter.py
          python3 -m json.tool hooks/hooks.json >/dev/null
          sh -n hooks/poteto-mode-reminder.sh
          scripts/check-hook.sh
          python3 scripts/claude-code-adapt.py --check
          python3 scripts/claude-code-adapt.py --audit
